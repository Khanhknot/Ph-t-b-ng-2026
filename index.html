<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tra Cứu Thứ Tự Nhận Bằng</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #0d1b2a;
      --navy-mid: #1b2f47;
      --gold: #c9a84c;
      --gold-light: #e8c97e;
      --cream: #f5f0e8;
      --white: #ffffff;
      --red: #c0392b;
      --green: #1a6b3c;
      --text-muted: #8a9ab0;
    }

    body {
      min-height: 100vh;
      background-color: var(--navy);
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(201, 168, 76, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(201, 168, 76, 0.05) 0%, transparent 50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: 'DM Sans', sans-serif;
    }

    /* Decorative top border */
    .top-border {
      width: 100%;
      max-width: 520px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
      margin-bottom: 2.5rem;
      border-radius: 2px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--navy-mid);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 4px;
      padding: 2.5rem 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Corner accents */
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.6;
    }

    .card::before {
      top: 12px;
      left: 12px;
      border-width: 2px 0 0 2px;
    }

    .card::after {
      bottom: 12px;
      right: 12px;
      border-width: 0 2px 2px 0;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .logo-divider {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.5));
    }

    .logo-divider.right {
      background: linear-gradient(90deg, rgba(201, 168, 76, 0.5), transparent);
    }

    .logo-diamond {
      width: 8px;
      height: 8px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .university-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--gold);
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 900;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      font-weight: 300;
    }

    /* Input section */
    .input-section {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .input-wrapper {
      display: flex;
      gap: 0.6rem;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 3px;
      padding: 0.75rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--white);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.05em;
    }

    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.2);
      font-weight: 300;
    }

    input[type="text"]:focus {
      border-color: var(--gold);
      background: rgba(201, 168, 76, 0.06);
    }

    button {
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 3px;
      padding: 0.75rem 1.4rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover {
      background: var(--gold-light);
    }

    button:active {
      transform: scale(0.97);
    }

    /* Result area */
    #result {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(201, 168, 76, 0.15);
      padding-top: 1.5rem;
      transition: opacity 0.3s;
    }

    .placeholder-text {
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-align: center;
    }

    /* Found card */
    .result-found {
      width: 100%;
      animation: fadeUp 0.35s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 2px;
      margin-bottom: 0.75rem;
    }

    .badge-cn {
      background: rgba(26, 107, 60, 0.25);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .badge-ks {
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(147, 197, 253, 0.3);
    }

    .stt-display {
      text-align: center;
      margin: 0.5rem 0 1rem;
    }

    .stt-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .stt-number {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 12vw, 4.5rem);
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 40px rgba(201, 168, 76, 0.3);
    }

    .stt-info-row {
      display: flex;
      gap: 1rem;
      margin-top: 0.75rem;
    }

    .info-chip {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      padding: 0.6rem 0.75rem;
      text-align: center;
    }

    .info-chip-label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .info-chip-value {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--white);
    }

    /* Not found */
    .result-notfound {
      text-align: center;
      animation: fadeUp 0.3s ease;
    }

    .notfound-icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .notfound-text {
      color: #f87171;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .notfound-hint {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 0.3rem;
    }

    /* Footer */
    .bottom-border {
      width: 100%;
      max-width: 520px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.2), transparent);
      margin-top: 1.5rem;
    }

    .footer-text {
      margin-top: 1rem;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>

    function lookup() {
      const val = input.value.trim();
      if (!val) { showPlaceholder(); return; }

      const record = lookup_map[val];

      if (record) {
        const isCN = record.Bang === 'Cử nhân';
        const badgeClass = isCN ? 'badge-cn' : 'badge-ks';

        resultDiv.innerHTML = `
          <div class="result-found">
            <span class="result-badge ${badgeClass}">${record.Bang}</span>
            <div class="stt-display">
              <div class="stt-label">Số thứ tự ký sổ</div>
              <div class="stt-number">${record.STT}</div>
            </div>
            <div class="stt-info-row">
              <div class="info-chip">
                <div class="info-chip-label">MSSV</div>
                <div class="info-chip-value">${record.SHSV}</div>
              </div>
              <div class="info-chip">
                <div class="info-chip-label">Loại bằng</div>
                <div class="info-chip-value">${record.Bang}</div>
              </div>
            </div>
          </div>`;
      } else {
        resultDiv.innerHTML = `
          <div class="result-notfound">
            <div class="notfound-icon">✕</div>
            <div class="notfound-text">Không tìm thấy sinh viên</div>
            <div class="notfound-hint">Kiểm tra lại số hiệu sinh viên</div>
          </div>`;
      }
    }

    function showPlaceholder() {
      resultDiv.innerHTML = '<p class="placeholder-text">Kết quả sẽ hiển thị ở đây</p>';
    }
  </script>
</body>

</html>
